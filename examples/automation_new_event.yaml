# Automation: auf neue Einträge im Ereignisprotokoll reagieren
alias: FRITZ!Box - neues Ereignis
triggers:
  - trigger: event
    event_type: fritzbox_ereignisse_new_event
conditions:
  - condition: template
    value_template: "{{ trigger.event.data.group == 'internet' }}"
actions:
  - action: persistent_notification.create
    data:
      title: "FRITZ!Box"
      message: "{{ trigger.event.data.message }}"
